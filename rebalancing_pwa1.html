<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rebalancing App</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background:#f5f5f5; }
    h1 { text-align:center; }
    .card { background:white; padding:15px; margin-bottom:15px; border-radius:10px; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
    input { width:100%; padding:10px; margin:5px 0 15px; border-radius:8px; border:1px solid #ccc; }
    button { width:100%; padding:10px; background:#0066ff; color:white; border:none; border-radius:8px; font-size:16px; }
    .result { font-weight:bold; margin-top:10px; }
  </style>
<style>
  body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 10px; background: #f4f4f7; }
  .card { background: white; padding: 16px; margin: 12px 0; border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  input { width: 100%; padding: 10px; margin-top: 8px; border-radius: 10px; border: 1px solid #ccc; font-size: 16px; }
  button { width: 100%; padding: 12px; border: none; border-radius: 10px; font-size: 16px; margin-top: 12px; background: #007aff; color: white; }
  #chartContainer { margin-top: 20px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <h1>Rebalancing App</h1>

  <div class="card">
    <h3>Portfolio eingeben</h3>

    <label>Cash (€)</label>
    <input id="cash" type="number" />

    <label>ACWI (€)</label>
    <input id="acwi" type="number" />

    <label>Krypto (€)</label>
    <input id="krypto" type="number" />

    <button onclick="berechnen()">Rebalancing berechnen</button>
  </div>

  <div class="card">
    <h3>Ergebnis</h3>
    <div id="output"></div>
  </div>

<script>
  const TARGET = { cash: 0.75, acwi: 0.2375, krypto: 0.0125 };

  function berechnen() {
    const cash = parseFloat(document.getElementById('cash').value) || 0;
    const acwi = parseFloat(document.getElementById('acwi').value) || 0;
    const krypto = parseFloat(document.getElementById('krypto').value) || 0;

    const sum = cash + acwi + krypto;
    if (sum === 0) return;

    const sollCash = sum * TARGET.cash;
    const sollAcwi = sum * TARGET.acwi;
    const sollKrypto = sum * TARGET.krypto;

    const diffCash = sollCash - cash;
    const diffAcwi = sollAcwi - acwi;
    const diffKrypto = sollKrypto - krypto;

    const out = `
      Gesamt: ${sum.toFixed(2)} €<br><br>
      Cash: ${cash} € → Soll: ${sollCash.toFixed(2)} € → Differenz: ${diffCash.toFixed(2)} €<br>
      ACWI: ${acwi} € → Soll: ${sollAcwi.toFixed(2)} € → Differenz: ${diffAcwi.toFixed(2)} €<br>
      Krypto: ${krypto} € → Soll: ${sollKrypto.toFixed(2)} € → Differenz: ${diffKrypto.toFixed(2)} €<br>
    `;

    document.getElementById('output').innerHTML = out;

    localStorage.setItem('rebalance', JSON.stringify({ cash, acwi, krypto }));
  }

  window.onload = () => {
    const saved = JSON.parse(localStorage.getItem('rebalance') || '{}');
    if (saved.cash) document.getElementById('cash').value = saved.cash;
    if (saved.acwi) document.getElementById('acwi').value = saved.acwi;
    if (saved.krypto) document.getElementById('krypto').value = saved.krypto;
  };
// --- REBALANCING LOGIK + UI (NEU) ---

// Zielgewichte
const targets = { cash: 0.75, acwi: 0.2375, crypto: 0.0125 };

// Laden gespeicherter Daten
let portfolio = JSON.parse(localStorage.getItem('portfolio')) || {
  cash: 0,
  acwi: 0,
  crypto: 0,
};

// UI aktualisieren
function updateUI() {
  document.getElementById('cashInput').value = portfolio.cash;
  document.getElementById('acwiInput').value = portfolio.acwi;
  document.getElementById('cryptoInput').value = portfolio.crypto;

  const total = portfolio.cash + portfolio.acwi + portfolio.crypto;
  if (total <= 0) return;

  const actual = {
    cash: portfolio.cash / total,
    acwi: portfolio.acwi / total,
    crypto: portfolio.crypto / total,
  };

  const diffs = {
    cash: total * targets.cash - portfolio.cash,
    acwi: total * targets.acwi - portfolio.acwi,
    crypto: total * targets.crypto - portfolio.crypto,
  };

  document.getElementById('output').innerHTML = `
    <h3>Rebalancing Ergebnis</h3>
    Gesamtwert: <strong>${total.toFixed(2)} €</strong><br><br>
    Cash: ${ (actual.cash*100).toFixed(1) }% (Soll ${targets.cash*100}%) → <strong>${diffs.cash.toFixed(2)} €</strong><br>
    ACWI: ${ (actual.acwi*100).toFixed(1) }% (Soll ${targets.acwi*100}%) → <strong>${diffs.acwi.toFixed(2)} €</strong><br>
    Krypto: ${ (actual.crypto*100).toFixed(1) }% (Soll ${targets.crypto*100}%) → <strong>${diffs.crypto.toFixed(2)} €</strong><br>
  `;
}

// Speichern
function saveValues() {
  portfolio.cash = parseFloat(document.getElementById('cashInput').value) || 0;
  portfolio.acwi = parseFloat(document.getElementById('acwiInput').value) || 0;
  portfolio.crypto = parseFloat(document.getElementById('cryptoInput').value) || 0;

  localStorage.setItem('portfolio', JSON.stringify(portfolio));
  updateUI();

// --- PIE-CHART ---
let chart;
function renderChart() {
  const total = portfolio.cash + portfolio.acwi + portfolio.crypto;
  if (total <= 0) return;

  const ctx = document.getElementById('pieChart').getContext('2d');
  if (chart) chart.destroy();
  chart = new Chart(ctx, {
    type: 'pie',
    data: {
      labels: ['Cash', 'ACWI', 'Krypto'],
      datasets: [{ data: [portfolio.cash, portfolio.acwi, portfolio.crypto] }]
    }
  });
}

renderChart();
}

updateUI();

</script>

<canvas id="pieChart" width="300" height="300"></canvas>
</body>
</html>
