<!-- ...head section... -->
<style>
  body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; background: #f5f5f5; }
  .card { background: white; padding: 16px; margin: 12px 0; border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  input { width: 100%; padding: 10px; margin-top: 8px; border-radius: 10px; border: 1px solid #ccc; font-size: 16px; }
  button { width: 100%; padding: 12px; border: none; border-radius: 10px; font-size: 16px; margin-top: 12px; background: #007aff; color: white; }
  #chartContainer { margin-top: 20px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <h1>Rebalancing App</h1>

  <div class="card">
    <h3>Portfolio eingeben</h3>

    <label>Cash (€)</label>
    <input id="cashInput" type="number" />

    <label>ACWI (€)</label>
    <input id="acwiInput" type="number" />

    <label>Krypto (€)</label>
    <input id="cryptoInput" type="number" />

    <button onclick="saveValues()">Rebalancing berechnen</button>
  </div>

  <div class="card">
    <h3>Ergebnis</h3>
    <div id="output"></div>
  </div>

  <canvas id="pieChart" width="300" height="300"></canvas>

<script>
const targets = { cash: 0.75, acwi: 0.2375, crypto: 0.0125 };

let portfolio = JSON.parse(localStorage.getItem('portfolio')) || {
  cash: 0,
  acwi: 0,
  crypto: 0,
};

function updateUI() {
  document.getElementById('cashInput').value = portfolio.cash;
  document.getElementById('acwiInput').value = portfolio.acwi;
  document.getElementById('cryptoInput').value = portfolio.crypto;

  const total = portfolio.cash + portfolio.acwi + portfolio.crypto;
  if (total <= 0) {
    document.getElementById('output').innerHTML = '';
    return;
  }

  const actual = {
    cash: portfolio.cash / total,
    acwi: portfolio.acwi / total,
    crypto: portfolio.crypto / total,
  };

  const diffs = {
    cash: total * targets.cash - portfolio.cash,
    acwi: total * targets.acwi - portfolio.acwi,
    crypto: total * targets.crypto - portfolio.crypto,
  };

  document.getElementById('output').innerHTML = `
    Gesamtwert: <strong>${total.toFixed(2)} €</strong><br><br>
    Cash: ${(actual.cash * 100).toFixed(1)}% (Soll ${targets.cash * 100}%) → <strong>${diffs.cash.toFixed(2)} €</strong><br>
    ACWI: ${(actual.acwi * 100).toFixed(1)}% (Soll ${targets.acwi * 100}%) → <strong>${diffs.acwi.toFixed(2)} €</strong><br>
    Krypto: ${(actual.crypto * 100).toFixed(1)}% (Soll ${targets.crypto * 100}%) → <strong>${diffs.crypto.toFixed(2)} €</strong><br>
  `;
  renderChart();
}

function saveValues() {
  portfolio.cash = parseFloat(document.getElementById('cashInput').value) || 0;
  portfolio.acwi = parseFloat(document.getElementById('acwiInput').value) || 0;
  portfolio.crypto = parseFloat(document.getElementById('cryptoInput').value) || 0;
  localStorage.setItem('portfolio', JSON.stringify(portfolio));
  updateUI();
}

let chart;
function renderChart() {
  const total = portfolio.cash + portfolio.acwi + portfolio.crypto;
  if (total <= 0) return;

  const ctx = document.getElementById('pieChart').getContext('2d');
  if (chart) chart.destroy();
  chart = new Chart(ctx, {
    type: 'pie',
    data: {
      labels: ['Cash', 'ACWI', 'Krypto'],
      datasets: [{ data: [portfolio.cash, portfolio.acwi, portfolio.crypto] }]
    }
  });
}

window.onload = updateUI;
</script>
</body>
</html>
